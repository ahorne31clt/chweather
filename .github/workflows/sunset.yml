name: Daily sunset outlook

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: America/New_York
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'portfolio/**'
      - 'assets/**'
      - 'sunset/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'README.md'
      - 'output/pdf/**'
      - 'requirements-sunset*.txt'
      - '.github/workflows/sunset.yml'

concurrency:
  group: sunset-publication
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  forecast-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-sunset*.txt
      - name: Install ecCodes and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libeccodes0
          python -m pip install -r requirements-sunset-dev.txt
      - uses: actions/cache@v6
        with:
          path: .cache/sunset/ne_50m_*
          key: sunset-geography-v1
      - name: Test numerical behavior and failure handling
        run: python -m pytest -q tests/test_sunset.py
      - name: Fetch, calculate, and render
        run: python -m sunset
      - name: Retain downloadable forecast artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sunset-outlook
          path: generated/sunset/latest.*
          if-no-files-found: error
          retention-days: 7
      - name: Assemble static website (exclude private and development files)
        run: python scripts/package_site.py --output-dir _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Publish website and forecast together
        id: deployment
        uses: actions/deploy-pages@v4
