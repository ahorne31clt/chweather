name: Daily weather and sunset outlooks

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: America/New_York
    - cron: '30 5,11,17,23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'sunset/**'
      - 'weather/**'
      - 'tropical/**'
      - 'centers/**'
      - 'enso/**'
      - 'analysis/**'
      - 'ensembles/**'
      - 'radar/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'requirements-sunset*.txt'
      - 'output/pdf/**'
      - 'CNAME'
      - 'README.md'
      - '.github/workflows/sunset.yml'

concurrency:
  group: weather-publication
  cancel-in-progress: false

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  TZ: UTC

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-sunset*.txt
      - name: Install numerical and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libeccodes0
          python -m pip install -r requirements-sunset-dev.txt
      - name: Test generators and clean-checkout packaging
        run: python -m pytest -q tests

  generate:
    name: Generate ${{ matrix.product }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        product: [sunset, weather, tropical, centers, enso, analysis, ensembles]
    env:
      PRODUCT: ${{ matrix.product }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-sunset*.txt
      - name: Install headless weather dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libeccodes0
          python -m pip install -r requirements-sunset.txt
      - name: Generate from real source data
        timeout-minutes: 105
        run: python -m "$PRODUCT"
      - name: Validate this generator's manifest and every referenced asset
        run: python scripts/package_site.py --check --product "$PRODUCT"
      - name: Stage only this job's output with its generated/product directory
        run: |
          mkdir -p "$RUNNER_TEMP/forecast/generated"
          cp -a "generated/$PRODUCT" "$RUNNER_TEMP/forecast/generated/"
      - name: Transfer validated outputs to the publishing job
        uses: actions/upload-artifact@v7
        with:
          name: forecast-${{ matrix.product }}
          path: ${{ runner.temp }}/forecast/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: [verify, generate]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Download all seven products from this workflow run
        uses: actions/download-artifact@v8
        with:
          pattern: forecast-*
          merge-multiple: true
          path: .
      - name: Verify the complete website before publishing
        run: python scripts/package_site.py --check
      - name: Assemble website and matching forecast assets
        run: python scripts/package_site.py --output-dir _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Publish website and forecasts together
        id: deployment
        uses: actions/deploy-pages@v4
