name: Daily weather and sunset outlooks

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: America/New_York
    - cron: '30 5,11,17,23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'sunset/**'
      - 'weather/**'
      - 'models/**'
      - 'tropical/**'
      - 'centers/**'
      - 'enso/**'
      - 'analysis/**'
      - 'ensembles/**'
      - 'radar/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'requirements-sunset*.txt'
      - 'output/pdf/**'
      - 'CNAME'
      - 'README.md'
      - '.github/workflows/sunset.yml'

concurrency:
  group: outlook-generation
  cancel-in-progress: false

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  TZ: UTC

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-sunset*.txt
      - name: Install native ecCodes library
        timeout-minutes: 5
        run: |
          sudo timeout 120 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          sudo timeout 120 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends libeccodes0
      - name: Install prebuilt numerical and test dependencies
        timeout-minutes: 15
        run: |
          python -m pip install --only-binary=:all: --timeout 30 --retries 2 --disable-pip-version-check -r requirements-sunset-dev.txt
      - name: Test generators and clean-checkout packaging
        timeout-minutes: 10
        run: python -m pytest -q tests

  generate:
    name: Generate ${{ matrix.product }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        product: [sunset, weather, tropical, centers, enso, analysis, ensembles]
    env:
      PRODUCT: ${{ matrix.product }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-sunset*.txt
      - name: Install native ecCodes library
        timeout-minutes: 5
        run: |
          sudo timeout 120 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          sudo timeout 120 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends libeccodes0
      - name: Install prebuilt headless weather dependencies
        timeout-minutes: 15
        run: |
          python -m pip install --only-binary=:all: --timeout 30 --retries 2 --disable-pip-version-check -r requirements-sunset.txt
      - name: Generate from real source data
        timeout-minutes: 95
        run: python -m "$PRODUCT"
      - name: Validate this generator's manifest and every referenced asset
        run: python scripts/package_site.py --check --product "$PRODUCT"
      - name: Stage only this job's output with its generated/product directory
        run: |
          mkdir -p "$RUNNER_TEMP/forecast/generated"
          cp -a "generated/$PRODUCT" "$RUNNER_TEMP/forecast/generated/"
      - name: Transfer validated outputs to the publishing job
        uses: actions/upload-artifact@v7
        with:
          name: forecast-${{ matrix.product }}
          path: ${{ runner.temp }}/forecast/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  bundle:
    needs: [verify, generate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: forecast-*
          merge-multiple: true
          path: .
      - name: Validate and stage all seven outlook products
        run: |
          mkdir -p "$RUNNER_TEMP/outlooks/generated"
          for product in sunset weather tropical centers enso analysis ensembles; do
            python scripts/package_site.py --check --product "$product"
            cp -a "generated/$product" "$RUNNER_TEMP/outlooks/generated/"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: outlooks-bundle
          path: ${{ runner.temp }}/outlooks/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
