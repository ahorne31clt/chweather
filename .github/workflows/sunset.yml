name: Daily weather and sunset outlooks

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: America/New_York
    - cron: '0 16 * * *'
      timezone: America/New_York
    - cron: '30 5,11,17,23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'sunset/**'
      - 'weather/**'
      - 'specialty/**'
      - 'optics/**'
      - 'models/**'
      - 'tropical/**'
      - 'centers/**'
      - 'enso/**'
      - 'analysis/**'
      - 'ensembles/**'
      - 'radar/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'requirements-sunset*.txt'
      - 'output/pdf/**'
      - 'CNAME'
      - 'README.md'
      - '.github/workflows/sunset.yml'

concurrency:
  group: ${{ github.event.schedule == '0 16 * * *' && 'sunset-final-generation' || 'outlook-generation' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  TZ: UTC

jobs:
  verify:
    outputs:
      products: ${{ steps.plan.outputs.products }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-sunset*.txt
      - name: Install prebuilt numerical and test dependencies
        timeout-minutes: 15
        run: |
          python -m pip install --only-binary=:all: --timeout 30 --retries 2 --disable-pip-version-check -r requirements-sunset-dev.txt
      - name: Verify ecCodes can decode GRIB
        run: |
          python -c "import eccodes; message = eccodes.codes_grib_new_from_samples('GRIB2'); print(eccodes.codes_get(message, 'edition')); eccodes.codes_release(message)"
      - name: Select forecast products for this schedule
        id: plan
        env:
          OUTLOOK_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import json, os
          from scripts.run_product import outlook_products
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print('products=' + json.dumps(outlook_products(os.environ.get('OUTLOOK_SCHEDULE', ''))), file=output)
          PY
      - name: Test generators and clean-checkout packaging
        timeout-minutes: 10
        run: python -m pytest -q tests

  generate:
    name: Generate ${{ matrix.product }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        product: ${{ fromJSON(needs.verify.outputs.products) }}
    env:
      PRODUCT: ${{ matrix.product }}
      SUNSET_EDITION: ${{ github.event.schedule == '0 16 * * *' && 'final' || github.event.schedule == '0 8 * * *' && 'morning' || 'update' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-sunset*.txt
      - name: Install prebuilt headless weather dependencies
        timeout-minutes: 15
        run: |
          python -m pip install --only-binary=:all: --timeout 30 --retries 2 --disable-pip-version-check -r requirements-sunset.txt
      - name: Verify ecCodes can decode GRIB
        run: |
          python -c "import eccodes; message = eccodes.codes_grib_new_from_samples('GRIB2'); print(eccodes.codes_get(message, 'edition')); eccodes.codes_release(message)"
      - name: Clear checkout manifest before this generation attempt
        run: python -c "from pathlib import Path; import os; Path('generated',os.environ['PRODUCT'],'latest.json').unlink(missing_ok=True)"
      - name: Generate from real source data
        id: generate
        timeout-minutes: 95
        run: python -m scripts.run_product "$PRODUCT"
      - name: Validate this generator's manifest and every referenced asset
        id: validate
        if: always() && (steps.generate.outcome == 'success' || steps.generate.outcome == 'failure')
        run: python scripts/package_site.py --check --product "$PRODUCT"
      - name: Stage only this job's output with its generated/product directory
        id: stage
        if: always() && steps.validate.outcome == 'success' 
        run: |
          mkdir -p "$RUNNER_TEMP/forecast/generated"
          cp -a "generated/$PRODUCT" "$RUNNER_TEMP/forecast/generated/"
      - name: Transfer validated outputs to the publishing job
        if: always() && steps.stage.outcome == 'success' 
        uses: actions/upload-artifact@v7
        with:
          name: forecast-${{ matrix.product }}
          path: ${{ runner.temp }}/forecast/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

