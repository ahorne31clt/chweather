name: Scheduled weather models

on:
  schedule:
    - cron: '30 5,11,17,23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'models/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements-sunset*.txt'
      - '.github/workflows/models.yml'

concurrency:
  group: model-generation
  cancel-in-progress: false

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  TZ: UTC

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-sunset*.txt
      - name: Install native ecCodes library
        timeout-minutes: 5
        run: |
          sudo timeout 120 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          sudo timeout 120 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends libeccodes0
      - name: Install prebuilt numerical and test dependencies
        timeout-minutes: 15
        run: |
          python -m pip install --only-binary=:all: --timeout 30 --retries 2 --disable-pip-version-check -r requirements-sunset-dev.txt
      - name: Test generators and clean-checkout packaging
        timeout-minutes: 10
        run: python -m pytest -q tests

  generate:
    name: Generate ${{ matrix.model }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        model: [gfs, hrrr, nam]
    env:
      MODEL: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-sunset*.txt
      - name: Install native ecCodes library
        timeout-minutes: 5
        run: |
          sudo timeout 120 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          sudo timeout 120 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends libeccodes0
      - name: Install prebuilt headless weather dependencies
        timeout-minutes: 15
        run: |
          python -m pip install --only-binary=:all: --timeout 30 --retries 2 --disable-pip-version-check -r requirements-sunset.txt
      - name: Generate from real source data
        timeout-minutes: 150
        run: python -m models --model "$MODEL"
      - name: Validate this generator's manifest and every referenced asset
        run: python -m scripts.merge_models --check-part generated/models --model "$MODEL"
      - name: Stage only this job's output with its generated/product directory
        run: |
          python -m scripts.merge_models --check-part generated/models --model "$MODEL" --stage "$RUNNER_TEMP/forecast"
      - name: Transfer validated outputs to the publishing job
        uses: actions/upload-artifact@v7
        with:
          name: model-${{ matrix.model }}
          path: ${{ runner.temp }}/forecast/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  bundle:
    needs: [verify, generate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: model-*
          path: .model-parts
      - name: Merge all three complete model runs and matching airport guidance
        run: |
          python -m scripts.merge_models --parts .model-parts --output generated/models --stage "$RUNNER_TEMP/models"
          python scripts/package_site.py --check --product models
      - uses: actions/upload-artifact@v7
        with:
          name: models-bundle
          path: ${{ runner.temp }}/models/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
